<!doctype html>
<meta charset="utf-8" />
<title>relay load</title>
<body>
<script>
// WebRTC half of the relay load test. Driven over CDP by ../relay-load.mjs,
// which does all the Harmony HTTP and WebSocket work and hands this page only
// URLs -- so everything here is peer connections and nothing else.
//
// What is being measured is the RELAY, not this page. The client side was
// already measured in the Phase 0 spike (sixteen audio subscriptions for 7.3%
// of one core), so the numbers that matter come from the server. The client
// stats reported here exist to prove this page was not itself the bottleneck.

const members = new Map();   // mid -> { pub, subs: Map<mid, pc> }
let micTrack = null;
let micStream = null;

const log = [];
window.loadLog = () => log.slice(-60);
const note = (m) => log.push(m);

/** Non-trickle ICE: MediaMTX takes one complete offer. */
function gathered(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', h); resolve(); };
    const h = () => { if (pc.iceGatheringState === 'complete') done(); };
    pc.addEventListener('icegatheringstatechange', h);
    const t = setTimeout(done, 5000);
  });
}

async function exchange(url, sdp) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/sdp' },
    body: sdp,
  });
  const body = await res.text();
  return { status: res.status, location: res.headers.get('Location'), body };
}

/**
 * One fake microphone shared by every simulated member.
 *
 * Chromium's fake device is a tone generator, and one track can be attached to
 * any number of peer connections. Opening N real captures would measure the
 * capture pipeline instead of the relay.
 */
window.initMic = async () => {
  if (micTrack) return { ok: true, reused: true };
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  micTrack = micStream.getAudioTracks()[0];
  return { ok: true, reused: false };
};

/** Publish one member's microphone. */
window.publishMember = async (mid, url) => {
  try {
    const pc = new RTCPeerConnection();
    pc.addTransceiver(micTrack, { direction: 'sendonly', streams: [micStream] });
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await gathered(pc);

    const r = await exchange(url, pc.localDescription.sdp);
    if (r.status !== 201) { pc.close(); return { ok: false, status: r.status, body: r.body.slice(0, 200) }; }
    await pc.setRemoteDescription({ type: 'answer', sdp: r.body });

    if (!members.has(mid)) members.set(mid, { pub: null, subs: new Map() });
    members.get(mid).pub = pc;
    note(`publish ${mid} ok`);
    return { ok: true };
  } catch (err) { return { ok: false, error: String(err.message || err) }; }
};

/** Subscribe member `mid` to peer `peerMid`. */
window.subscribePeer = async (mid, peerMid, url) => {
  try {
    const pc = new RTCPeerConnection();
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await gathered(pc);

    const r = await exchange(url, pc.localDescription.sdp);
    if (r.status !== 201) { pc.close(); return { ok: false, status: r.status, body: r.body.slice(0, 200) }; }
    await pc.setRemoteDescription({ type: 'answer', sdp: r.body });

    if (!members.has(mid)) members.set(mid, { pub: null, subs: new Map() });
    members.get(mid).subs.set(peerMid, pc);
    return { ok: true };
  } catch (err) { return { ok: false, error: String(err.message || err) }; }
};

/** Aggregate receive-side health across every subscription. */
window.sample = async () => {
  let connected = 0;
  let total = 0;
  let bytes = 0;
  let packets = 0;
  let lost = 0;
  let concealed = 0;
  let samplesTotal = 0;
  let maxRtt = 0;

  for (const member of members.values()) {
    for (const pc of member.subs.values()) {
      total += 1;
      if (pc.connectionState === 'connected') connected += 1;
      const stats = await pc.getStats();
      stats.forEach((r) => {
        if (r.type === 'inbound-rtp' && r.kind === 'audio') {
          bytes += r.bytesReceived || 0;
          packets += r.packetsReceived || 0;
          lost += r.packetsLost || 0;
          concealed += r.concealedSamples || 0;
          samplesTotal += r.totalSamplesReceived || 0;
        }
        if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') {
          maxRtt = Math.max(maxRtt, r.currentRoundTripTime || 0);
        }
      });
    }
  }
  return { total, connected, bytes, packets, lost, concealed, samplesTotal, maxRtt };
};

window.teardown = async () => {
  for (const member of members.values()) {
    for (const pc of member.subs.values()) pc.close();
    member.pub?.close();
  }
  members.clear();
  micStream?.getTracks().forEach((t) => t.stop());
  micTrack = null;
  micStream = null;
  return true;
};

window.loadReady = true;
</script>
</body>
